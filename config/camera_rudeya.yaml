# カメラの買取ルデヤ（kaitori-rudeya.com）の取得対象。scripts/collect_camera_rudeya.py が読む。
#
# 重要:
#   - 採用の根拠（Source Admission Gate）: 店舗公式／商品名と JAN が一覧・商品ページに載る／現在価格が数字／状態は「新品」バッジ／
#     ページに「YYYY年M月D日 H時M分現在」「YYYY-MM-DD 現在」／1 週間に 1 回で足りる／robots.txt は /search だけ禁止／CAPTCHA・WAF・ログイン不要。
#   - 受付状態は TCG と同じ fail-closed（src/tcg/buyback.py の accept_state）。受付中と確認できない行は行を作らない。
#   - 機種の同一性: 一覧の JAN が下の jan と一致し、商品名に name_contains がすべて含まれ、name_excludes が 1 つも含まれないこと。
#     JAN 一致だけで確定しない（版・色・キットの違いは名前でも確認する）。
#   - 価格は一覧と商品ページで一致したものだけ採用する（食い違う行は採用しない）。
#   - 売値は「保証書に店舗印ありの価格」（完品 - 備考の減額）。店で買った新品は店舗印が付く可能性が高く、購入元の店舗印の有無を確認できないための安全側。
#     備考が「店舗印あり買取不可」の機種は行を作らない。店が注意事項（「JANコード要確認」等）を付けた行も採用しない。店頭での査定額は未確認。
