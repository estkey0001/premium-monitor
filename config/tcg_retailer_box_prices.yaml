# TCG の BOX 単位「販売店の実販売価格」台帳（手動記録）。
#
# 重要（メーカー公式定価とは別物）:
#   - ここに載せるのは、販売店自身のページに「1BOX ○○円」と書かれている価格だけ。公式定価（exports/tcg/msrp.json の verified）には入れない。
#   - パック価格×入数で BOX 価格を作らない。「20パック固定 7,200円」のような組の価格は BOX 価格ではないので載せない。
#   - 受付状態（accept_state）は保存しない。応募期間・当選者の購入期間から、表示・生成時の now で導出する（src/tcg/retailer_box.py）。
#   - 応募が終わった・当選者のみ・期間外の価格は「過去の参考情報」にとどまり、利益には使わない。
#   - JAN・BOX の状態（新品/シュリンク）はどのページにも無いので未確認（jan: null / box_condition: UNKNOWN）。
#   - product_id は pokemon_registry.json（商品マスタ）と buyback の targets に一致するものだけ。一致しない商品は採用しない。
#   - verified_at は人が確認した日。観測日を書き換えない。human_confirmed は main が決めるので false を既定にする。
#   - 日付だけの終了日は、その日の終わり（23:59:59）まで有効として扱う。
#
# 項目: id / product_id / tcg / retailer / shop / unit / box_condition / price_jpy / price_basis(=retailer_listed_box のみ有効) /
#       sale_method(LOTTERY のみ条件付きの利益に使う) / apply_start / apply_end / winner_announcement / purchase_start / purchase_end /
#       shipping / source_url / verified_at / jan / human_confirmed / note
