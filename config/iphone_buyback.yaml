# 週次の iPhone 買取比較（src/research/weekly_import.py）の暫定しきい値。
# 根拠の少ない暫定値で、買取店ごとの特性（更新の頻度・休業日）が分かったら店ごと（freshness.sources）に変える。
# 値を変えても、保存済みの価格を書き換えない（次の週次の調査から効く）。

# 外れ値: 実行可能な最高値が 2 位より rate を超えて高いとき、最高値は「掲載の最高値」として表示・保存するが、
# 利益計算には使わず OUTLIER_REVIEW にする（次点を「最高の実行可能価格」と呼ばない）。
# 人が公式の店舗ページで確認したら reviewed に書く（その価格・その調査日だけ有効）。
outlier:
  rate: 0.03
  reviewed: []
  #  - {sku: "iPhone Duo 1TB", shop_key: pastec, price: 492000, reviewed_on: "2026-11-14", note: "店舗の公式ページで色・条件を確認"}

# 鮮度: ページ自身の更新日からの日数。fresh_days 以内 = FRESH、超えたら STALE（利益の主要価格に使わない。表示は残す）。
# 更新日の記載が無い = UNKNOWN_FRESHNESS（古いとも新しいとも言わない。「掲載の最高値」として表示するが、利益計算には使わない）。
# 休業日・定休日で更新が無いだけの店は、店ごとの fresh_days で長くできる（誤価格とは扱わない）。
freshness:
  default:
    fresh_days: 1
  # ページ表示時（runtime）の期限。生成時の FRESH が、ページを開いた時点でも成立するかを src/content/iphone_buyback_page.py が判定し直す。
  # page_buy_days: 買取価格の確認日（updated_on / 調査日）から何日目の終わりまで「更新が新しい・最高買取・利益・購入候補」を出すか。
  #   週次の調査の周期（7 日）に合わせた値。超えたら、取得日つきの過去の参考価格に切り替える（週次の古さ警告 age_banner も同じ値）。
  #   ページの 7 日の唯一の定義はここ（コードに直書きしない）。HOME の 14 日（別の用途）とは独立。
  page_buy_days: 7
  # apple_availability_days: Apple の購入可否（apple_availability.checked_at。時刻つきの ISO）の期限（日数 × 24 時間。日付の丸めなし）。
  #   在庫は買取価格より動きが速い。Camera の在庫確認（stock_days=2）と同じ考え方で 2 日。超えたら「購入できる」「購入候補」を隠す。
  apple_availability_days: 2
  sources: {}
  #  akimoba: {fresh_days: 2, note: "休業日がある（2026-11-13 は店頭・郵送とも休業の記載）"}
  # 実行可能価格に使うのは FRESH だけ。STALE と UNKNOWN_FRESHNESS は設定で許せない（誤価格を利益にしないため）。

# 急騰: 同じ店・同じ SKU の前回の週次から +surge_yen 円以上
surge:
  yen: 5000
