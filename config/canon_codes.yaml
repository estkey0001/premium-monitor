# 根拠: キヤノン公式の製品トップ（personal.canon.jp/product/camera/eos/<slug>）と、キットは <slug>/kit の「JANコード」「商品コード」の定義リスト
# （2026-10-29 に確認。取得は公式のページだけ・robots は全許可）。購入ページは store.canon.jp/online/g/g<商品コード>/（JSON-LD の価格）。
