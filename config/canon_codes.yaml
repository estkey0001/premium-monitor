# - 色違い・キット違いは JAN も商品コードも別。1行 = 1つの JAN。名前や型番の近さで行を作らない
# - 推測値を書かない。確認できなかった行は載せない。載せたら checked_on（確認日）を更新するのは人が公式で再確認したときだけ
# - 在庫は購入ページの納期の文言から作らない（在庫の根拠にしない）
